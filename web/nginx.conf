# SPA + API reverse proxy. Serving both from one origin means session
# cookies just work — no CORS, matching the Vite dev-proxy setup.
server {
    listen 80;
    client_max_body_size 275M;
    client_body_timeout 120s;

    # AI assistant ("Ask"), compose profile `assistant`. It lives under /api/ because the session cookie is scoped to
    # that path. A variable plus Docker's resolver means nginx still starts when the assistant is not running; its
    # requests then get 502 and the SPA hides the Ask item. No URI on proxy_pass, so the request path is passed as is.
    # 90 s covers the worst case: 20 s waiting for the shared LLM plus its 45 s timeout.
    # Host keeps the port here ($http_host, not $host): the service compares the browser's Origin with it, which is how
    # a request from the page's own address is recognised without anyone listing that address.
    location /api/assistant/ {
        resolver 127.0.0.11 valid=10s;
        set $assistant http://assistant:8000;
        proxy_pass $assistant;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # API mount (server.servlet.context-path=/api) — no rewrite, the backend
    # expects the /api prefix.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Everything else is the single-page app (client-side deep links)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
