<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="680" height="272" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Embeddings as a map of meaning</title>
  <desc>Text chunks placed by meaning. Chunks about calibration and torque drivers sit close to the question; chunks about ESD wrist straps sit far away. The three closest chunks are highlighted.</desc>
  <rect x="0.5" y="0.5" width="679" height="271" rx="8" fill="#ffffff" stroke="#d3d1c7"/>

  <g stroke="#888780" stroke-width="1" stroke-dasharray="4 4">
    <line x1="250" y1="145" x2="185" y2="105"/>
    <line x1="250" y1="145" x2="325" y2="120"/>
    <line x1="250" y1="145" x2="215" y2="200"/>
  </g>

  <g fill="#d3d1c7" stroke="#5f5e5a" stroke-width="0.75">
    <circle cx="110" cy="60" r="6"/>
    <circle cx="340" cy="205" r="6"/>
    <circle cx="520" cy="80" r="6"/>
    <circle cx="560" cy="150" r="6"/>
    <circle cx="380" cy="250" r="6"/>
  </g>
  <g fill="#9fe1cb" stroke="#0f6e56" stroke-width="0.75">
    <circle cx="185" cy="105" r="6"/>
    <circle cx="325" cy="120" r="6"/>
    <circle cx="215" cy="200" r="6"/>
    <circle cx="48" cy="250" r="6"/>
  </g>
  <circle cx="250" cy="145" r="9" fill="#f5c4b3" stroke="#993c1d" stroke-width="0.75"/>

  <g font-size="12" fill="#444441" dominant-baseline="central">
    <text x="120" y="60">torque setting</text>
    <text x="350" y="205">out of tolerance</text>
    <text x="530" y="80">wrist strap test</text>
    <text x="560" y="170" text-anchor="middle">failed strap test</text>
    <text x="175" y="105" text-anchor="end">torque verification</text>
    <text x="335" y="120">calibration frequency</text>
    <text x="205" y="200" text-anchor="end">calibration label</text>
    <text x="60" y="250">closest chunks: sent to the next stage</text>
    <text x="392" y="250">other chunks</text>
  </g>
  <text x="264" y="164" font-size="14" font-weight="bold" fill="#2c2c2a" dominant-baseline="central">your question</text>
</svg>
