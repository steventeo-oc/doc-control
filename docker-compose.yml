version: "3.9"

# Document Control system — local/dev environment.
# Separate from the Testing Floor/MES stack by design (see CLAUDE.md).
# This file is a starting point, not final production config — production
# should add resource limits, restart policies tuned for the real server,
# and TLS termination at the reverse proxy.
#
# Host ports are overridable via env (compose reads .env or the shell), e.g.
# when the dev machine already runs local Postgres/MinIO on the defaults:
#   POSTGRES_HOST_PORT=15432 MINIO_HOST_PORT=19000 MINIO_CONSOLE_HOST_PORT=19001 docker compose up -d

services:
  postgres:
    image: postgres:16
    container_name: doccontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doccontrol
      POSTGRES_USER: doccontrol
      POSTGRES_PASSWORD: changeme_in_env_file
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doccontrol"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: doccontrol-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: doccontrol
      MINIO_ROOT_PASSWORD: changeme_in_env_file
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: doccontrol-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/doccontrol
      SPRING_DATASOURCE_USERNAME: doccontrol
      SPRING_DATASOURCE_PASSWORD: changeme_in_env_file
      DOCCONTROL_STORAGE_ENDPOINT: http://minio:9000
      # Set these for anything beyond local dev (see CLAUDE.md go-live checklist):
      # DOCCONTROL_BOOTSTRAP_ADMIN_EMAIL: ...
      # DOCCONTROL_BOOTSTRAP_ADMIN_PASSWORD: ...
      # SPRING_PROFILES_ACTIVE: prod   # startup hard-fails on default admin
      #                                # credentials under this profile
      # Microsoft Graph mail (Phase 2b) — log-only until enabled=true with the
      # Azure app registration values (tenant of the app registration; client
      # id/secret of its Mail.Send app; the sending mailbox's SMTP address):
      # DOCCONTROL_NOTIFICATION_ENABLED: "true"
      # DOCCONTROL_NOTIFICATION_TENANT_ID: ...
      # DOCCONTROL_NOTIFICATION_CLIENT_ID: ...
      # DOCCONTROL_NOTIFICATION_CLIENT_SECRET: ...
      # DOCCONTROL_NOTIFICATION_SENDER_MAILBOX: doccontrol@your-domain.com
    ports:
      - "8080:8080"

  web:
    build: ./web
    container_name: doccontrol-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  minio_data:
