# Document Control System — Docker Compose Configuration
# Production & Local Hosting
# Configuration is managed via .env (copy from .env.example)

services:
  postgres:
    image: postgres:16
    container_name: doccontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doccontrol}
      POSTGRES_USER: ${POSTGRES_USER:-doccontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_env_file}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doccontrol}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: doccontrol-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-doccontrol}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_in_env_file}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: doccontrol-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/doccontrol}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-doccontrol}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-changeme_in_env_file}
      DOCCONTROL_STORAGE_ENDPOINT: ${DOCCONTROL_STORAGE_ENDPOINT:-http://minio:9000}
      DOCCONTROL_STORAGE_ACCESS_KEY: ${DOCCONTROL_STORAGE_ACCESS_KEY:-doccontrol}
      DOCCONTROL_STORAGE_SECRET_KEY: ${DOCCONTROL_STORAGE_SECRET_KEY:-changeme_in_env_file}
      DOCCONTROL_STORAGE_BUCKET: ${DOCCONTROL_STORAGE_BUCKET:-doccontrol}
      DOCCONTROL_NOTIFICATION_ENABLED: ${DOCCONTROL_NOTIFICATION_ENABLED:-false}
      DOCCONTROL_NOTIFICATION_TENANT_ID: ${DOCCONTROL_NOTIFICATION_TENANT_ID:-}
      DOCCONTROL_NOTIFICATION_CLIENT_ID: ${DOCCONTROL_NOTIFICATION_CLIENT_ID:-}
      DOCCONTROL_NOTIFICATION_CLIENT_SECRET: ${DOCCONTROL_NOTIFICATION_CLIENT_SECRET:-}
      DOCCONTROL_NOTIFICATION_SENDER_MAILBOX: ${DOCCONTROL_NOTIFICATION_SENDER_MAILBOX:-}
      DOCCONTROL_SSO_ENABLED: ${DOCCONTROL_SSO_ENABLED:-false}
      DOCCONTROL_WATERMARK_RENDITION_URL: ${DOCCONTROL_WATERMARK_RENDITION_URL:-http://gotenberg:3000}
      DOCCONTROL_BOOTSTRAP_ADMIN_EMAIL: ${DOCCONTROL_BOOTSTRAP_ADMIN_EMAIL:-admin@doccontrol.local}
      DOCCONTROL_BOOTSTRAP_ADMIN_PASSWORD: ${DOCCONTROL_BOOTSTRAP_ADMIN_PASSWORD:-changeme_admin}
      DOCCONTROL_BOOTSTRAP_ADMIN_DEPARTMENT: ${DOCCONTROL_BOOTSTRAP_ADMIN_DEPARTMENT:-QA}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "${API_HOST_PORT:-8080}:8080"

  web:
    build: ./web
    container_name: doccontrol-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-3000}:80"

  gotenberg:
    # Phase 2e watermarking: LibreOffice headless for automated document conversion
    image: gotenberg/gotenberg:8-libreoffice
    container_name: doccontrol-gotenberg
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI assistant ("Ask") — opt-in. Without its profile none of the services below start and the stack behaves
  # exactly as before. Design: AI_Assistant_Design_PlanBack.md. Setup and start-up: RUNBOOK.md section 7.
  #   docker compose --profile assistant up -d --build
  # ---------------------------------------------------------------------------
  assistant:
    build: ./assistant
    container_name: doccontrol-assistant
    profiles: ["assistant"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # false: nobody sees "Ask", admins still get the status page and the index keeps syncing
      DOCCONTROL_ASSISTANT_ENABLED: ${DOCCONTROL_ASSISTANT_ENABLED:-false}
      ASSISTANT_SOURCE: doccontrol
      ASSISTANT_AUTH: session
      ASSISTANT_API_URL: http://api:8080/api
      # Extra browser origins accepted on POSTs. The page's own address always is, so this only matters behind a proxy
      # that changes the Host header.
      ASSISTANT_ALLOWED_ORIGINS: ${APP_BASE_URL:-http://localhost:3000}
      # Two read-only credentials, created by scripts/assistant-setup.sh (never the api's own accounts)
      ASSISTANT_DB_URL: postgresql://assistant_ro@postgres:5432/${POSTGRES_DB:-doccontrol}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:-}
      ASSISTANT_MINIO_ENDPOINT: http://minio:9000
      ASSISTANT_MINIO_ACCESS_KEY: ${ASSISTANT_MINIO_ACCESS_KEY:-}
      ASSISTANT_MINIO_SECRET_KEY: ${ASSISTANT_MINIO_SECRET_KEY:-}
      ASSISTANT_MINIO_BUCKET: ${DOCCONTROL_STORAGE_BUCKET:-doccontrol}
      # Model servers: empty means the service's own default, which is unreachable from a container, so a missing
      # value shows up as "cannot reach ..." on the status page instead of silently using something else.
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      ASSISTANT_LLM_TEMPERATURE: ${ASSISTANT_LLM_TEMPERATURE:-}
      ASSISTANT_EMB_BASE_URL: ${ASSISTANT_EMB_BASE_URL:-}
      ASSISTANT_RERANK_BASE_URL: ${ASSISTANT_RERANK_BASE_URL:-}
      ASSISTANT_EXAMPLES: ${ASSISTANT_EXAMPLES:-}
      # Tunables, all optional: empty means the service's own default (plan-back section 2.7). ASSISTANT_ALLOWED_DEPARTMENTS
      # is a comma-separated list of department codes; empty means every signed-in user.
      ASSISTANT_ALLOWED_DEPARTMENTS: ${ASSISTANT_ALLOWED_DEPARTMENTS:-}
      ASSISTANT_PROMPT: ${ASSISTANT_PROMPT:-}
      ASSISTANT_MAX_CONCURRENT: ${ASSISTANT_MAX_CONCURRENT:-}
      ASSISTANT_RATE_PER_MIN: ${ASSISTANT_RATE_PER_MIN:-}
      ASSISTANT_RATE_PER_DAY: ${ASSISTANT_RATE_PER_DAY:-}
      ASSISTANT_SYNC_MINUTES: ${ASSISTANT_SYNC_MINUTES:-}
      ASSISTANT_LOG_RETENTION_DAYS: ${ASSISTANT_LOG_RETENTION_DAYS:-}
    volumes:
      - assistant_data:/data

  mock-models:
    # Stand-ins for the embedding, reranker and LLM servers so the whole flow runs on a machine with no GPU (plumbing
    # only: the answers prove nothing about quality). Start with --profile mock-models and point the three
    # ASSISTANT_*_BASE_URL values in .env at http://mock-models:8010/v1.
    build: ./assistant
    container_name: doccontrol-mock-models
    profiles: ["mock-models"]
    restart: unless-stopped
    command: ["python", "tools/mock_models.py", "--host", "0.0.0.0", "--port", "8010"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  assistant_data:
