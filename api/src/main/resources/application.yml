spring:
  application:
    name: doc-control-api

  datasource:
    # Defaults mirror docker-compose.yml (postgres service). When running inside
    # compose, the SPRING_DATASOURCE_* env vars override these; when running on a
    # dev machine against a local cluster, override them on the command line.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doccontrol}
    username: ${SPRING_DATASOURCE_USERNAME:doccontrol}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_in_env_file}

  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate must never alter it, only verify
      # that the entity mappings match it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      # PROPOSAL for production (pending confirmation — go-live checklist):
      #   * 25MB is ample for office documents (SOPs, forms, work instructions)
      #   * drawings/CAD (DWG) can exceed that; if large artifacts are in
      #     scope, 100MB max-file-size / 110MB max-request-size is the
      #     recommended ceiling
      #   * confirm by measuring the largest real artifact in the old
      #     Alfresco archive (kept read-only) before deciding
      # Memory is not the constraint — Spring spools uploads to temp files
      # and the MinIO SDK streams them — so the limit is abuse/disk hygiene.
      max-file-size: 50MB
      max-request-size: 55MB

doccontrol:
  workflow:
    # Escalation/reminder tuning confirmed with QA; overridable via
    # DOCCONTROL_WORKFLOW_* env vars (see WorkflowProperties).
    due-business-days: 3
    reminder-before-days: 1
    escalate-after-overdue-days: 2
    # Daily reminder/escalation sweep (07:00 server time)
    reminder-cron: "0 0 7 * * *"

  review:
    # Periodic review (Phase 2c, confirmed with QA): ONE interval for ALL
    # documents — never per-type; 0 switches review tracking off. Independent
    # knobs from the approval thresholds (annual cycles want a longer
    # reminder horizon); overridable via DOCCONTROL_REVIEW_* env vars.
    interval-months: 12
    reminder-before-days: 5
    escalate-after-overdue-days: 2

  acknowledgment:
    # Read & understood acknowledgment (Phase 2d, confirmed with QA):
    # department-scoped, record-only; window deliberately separate from the
    # approval thresholds — longer and lower-stakes. Overridable via
    # DOCCONTROL_ACKNOWLEDGMENT_* env vars.
    window-business-days: 7
    reminder-before-days: 2
    escalate-after-overdue-days: 2

  storage:
    # Defaults match docker-compose.yml's minio service on localhost (dev).
    # Inside compose the api container must override the endpoint:
    # DOCCONTROL_STORAGE_ENDPOINT=http://minio:9000
    #
    # PRODUCTION (go-live checklist): override credentials via env
    # (DOCCONTROL_STORAGE_ACCESS_KEY / DOCCONTROL_STORAGE_SECRET_KEY) and do
    # not use the MinIO root account for the api — create a dedicated MinIO
    # user with read/write access to the doccontrol bucket only. Serve MinIO
    # behind TLS at the reverse proxy; the S3 endpoint should then be https.
    endpoint: http://localhost:9000
    access-key: doccontrol
    secret-key: changeme_in_env_file
    bucket: doccontrol

  bootstrap:
    # Initial admin account, created on first startup ONLY if the user table
    # is empty. Override the password via DOCCONTROL_BOOTSTRAP_ADMIN_PASSWORD
    # in any real deployment — the checked-in default is for local dev only.
    admin-email: admin@doccontrol.local
    admin-password: changeme_admin
    admin-department: QA

app:
  cors:
    allowed-origins: http://localhost:3000

server:
  port: 8080
  # The API is mounted under /api so the SPA owns every other path — without
  # this, browser deep-links like /documents/42 would collide with the API
  # route /documents/{id} at the reverse proxy. The API spec's resource paths
  # (e.g. /auth/login) are unchanged relative to this mount.
  servlet:
    context-path: /api
    session:
      cookie:
        # Mitigates classic cross-site POSTs while CSRF tokens do the real
        # work (see SecurityConfig).
        same-site: "lax"

flowable:
  # Embedded engine (Phase 2b): shares our DataSource and transactions; its
  # ACT_* schema is auto-created. No async executor — the process is fully
  # synchronous and reminders/escalation are our own scheduled job.
  database-schema-update: "true"
  async-executor-activate: false
